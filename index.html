<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Roleplay</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/karakter.css" />
  <link rel="stylesheet" href="css/setting.css" />
</head>
<body>
  <div id="app">
    <!-- CHAT VIEW -->
    <section id="chatView" class="view">
      <div class="chat-header">
        <div class="char-info">
          <img id="charIcon" src="img/default-character.png" alt="Karakter" />
          <div>
            <h3 id="charName">Nama Karakter</h3>
            <span id="charStatus">Online</span>
          </div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleTranslate">
          <span class="slider"></span> Terjemahan
        </label>
      </div>
      <div id="chatContainer" class="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan..." />
        <button id="sendBtn">Kirim</button>
      </div>
    </section>

    <!-- KARAKTER VIEW -->
    <section id="karakterView" class="view hidden">
      <h2>Manajemen Karakter</h2>
      <button id="uploadKarakterBtn">Upload Karakter</button>
      <button id="createKarakterBtn">Buat Karakter Baru</button>
      <div id="karakterList"></div>
    </section>

    <!-- SETTING VIEW -->
    <section id="settingView" class="view hidden">
      <h2>Pengaturan</h2>
      <div class="setting-group">
        <label>Model AI:</label>
        <input type="text" id="modelInput" value="deepseek/deepseek-r1:free">
      </div>
      <div class="setting-group">
        <label>Text to Speech:</label>
        <input type="checkbox" id="ttsToggle">
      </div>
      <div class="setting-group">
        <label>NSFW Eksplisit:</label>
        <input type="checkbox" id="nsfwToggle">
      </div>
      <div class="setting-group">
        <label>Background:</label>
        <input type="file" id="bgUpload" accept="image/*">
        <button id="applyBgBtn">Terapkan</button>
      </div>
      <div class="setting-group">
        <label>Custom API Key:</label>
        <input type="text" id="customApiKeyInput">
      </div>
      <button id="clearChatBtn">Hapus Semua Chat</button>
    </section>

    <!-- NAVIGASI BAWAH -->
    <nav class="bottom-nav">
      <button id="navChat">Chat</button>
      <button id="navKarakter">Karakter</button>
      <button id="navSetting">Setting</button>
    </nav>
  </div>

  <!-- JavaScript -->
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/setting.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
